<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Overcharge</title>
<meta name="description" content="A third-person round-based roguelite shooter.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,700;1,700&family=Permanent+Marker&family=Saira+Semi+Condensed:wght@400;600;800&display=swap">
<style>
/* Layout: full-bleed WebGL stage; round + points top-left, radar top-right, health bottom-left, ability bar bottom-center. Single dusk-neon look by design. */
:root {
  --ink: #0e0718;
  --panel: rgba(18, 9, 32, 0.74);
  --fg: #f4ecff;
  --dim: #b7a6d6;
  --cyan: #4ff3ff;
  --gold: #ffd23f;
  --hp: #ff3d6e;
  --hot: #ff5a3c;
  --round: #ff3b3b;
  --display: "Chakra Petch", "Arial Narrow", system-ui, sans-serif;
  --ui: "Saira Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --hand: "Permanent Marker", "Comic Sans MS", cursive;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--ink); color: var(--fg); font-family: var(--ui); user-select: none; -webkit-user-select: none; }
#stage, #stage canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#hud { position: fixed; inset: 0; pointer-events: none; font-variant-numeric: tabular-nums; }
#hurt { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 45%, rgba(255, 30, 70, 0.75) 100%); opacity: 0; }
#zoomv { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(8, 4, 16, 0.55) 100%); opacity: 0; transition: opacity .12s; }
#crosshair { position: absolute; left: 50%; top: 50%; width: 0; height: 0; --g: 10px; }
#crosshair i { position: absolute; background: var(--fg); box-shadow: 0 0 3px rgba(0,0,0,.9); }
#crosshair i:nth-child(1) { width: 2px; height: 8px; left: -1px; top: calc(-8px - var(--g)); }
#crosshair i:nth-child(2) { width: 2px; height: 8px; left: -1px; top: var(--g); }
#crosshair i:nth-child(3) { width: 8px; height: 2px; top: -1px; left: calc(-8px - var(--g)); }
#crosshair i:nth-child(4) { width: 8px; height: 2px; top: -1px; left: var(--g); }
#crosshair b { position: absolute; width: 3px; height: 3px; left: -1.5px; top: -1.5px; background: var(--fg); border-radius: 50%; }
#hitm { position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; margin: -13px 0 0 -13px; opacity: 0; }
#hitm::before, #hitm::after { content: ""; position: absolute; left: 12px; top: 0; width: 2px; height: 26px; background: var(--c, #fff); transform: rotate(45deg); box-shadow: 0 0 4px rgba(0,0,0,.8); }
#hitm::after { transform: rotate(-45deg); }
#roundbox { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 2px; text-shadow: 0 2px 0 rgba(0,0,0,.6); }
#roundNum { font-family: var(--display); font-weight: 700; font-style: italic; font-size: 64px; line-height: .9; color: var(--round); text-shadow: 0 3px 0 #2a0008, 0 0 24px rgba(255, 59, 59, .45); }
#roundLbl { font-size: 12px; font-weight: 800; letter-spacing: .3em; color: var(--dim); }
#points { font-family: var(--display); font-weight: 700; font-size: 26px; color: var(--gold); margin-top: 6px; position: relative; }
#pointsPop { position: absolute; left: 100%; top: 0; margin-left: 10px; font-size: 18px; white-space: nowrap; }
#pointsPop span { display: block; animation: pp .8s ease-out forwards; }
@keyframes pp { from { opacity: 1; transform: translate(0, 0); } to { opacity: 0; transform: translate(24px, -18px); } }
#enemiesLeft { font-size: 14px; font-weight: 600; color: var(--dim); }
#powerups { display: flex; gap: 6px; margin-top: 6px; }
.pu { background: var(--panel); border: 1px solid var(--c); color: var(--c); font-size: 13px; font-weight: 800; padding: 2px 8px; letter-spacing: .06em; }
#banner { position: absolute; top: 24%; left: 0; right: 0; text-align: center; font-family: var(--display); font-style: italic; font-weight: 700; font-size: clamp(28px, 5vw, 58px); letter-spacing: .06em; color: var(--round); text-shadow: 0 3px 0 #000, 0 0 30px rgba(255, 59, 59, .5); opacity: 0; transition: opacity .25s; padding-inline: 16px; }
#banner small { display: block; font-family: var(--ui); font-style: normal; font-size: 16px; color: var(--fg); letter-spacing: .2em; font-weight: 600; }
#bossbar { position: absolute; top: calc(16px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); width: min(520px, 56vw); text-align: center; }
#bossbar .bname { font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: .3em; color: #e2a6ff; text-shadow: 0 2px 0 #000; }
#bossbar .track { height: 12px; background: rgba(0,0,0,.55); border: 1px solid rgba(226,166,255,.5); margin-top: 4px; }
#bossFill { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #8a2bff, #ff2e9a); }
#radar { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: 130px; height: 130px; border-radius: 50%; background: rgba(14, 7, 24, .55); border: 1px solid rgba(244,236,255,.18); }
#loadout { position: absolute; top: calc(154px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; max-width: 230px; }
.chip { background: var(--panel); border: 1px solid rgba(255,255,255,.14); border-left: 3px solid var(--c, #fff); padding: 2px 7px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.chip b { color: var(--c, #fff); font-weight: 800; }
#prompt { position: absolute; top: calc(50% + 60px); left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid rgba(255, 210, 63, .5); padding: 6px 14px; font-weight: 600; font-size: 16px; white-space: nowrap; }
#prompt kbd { font-family: var(--display); background: var(--gold); color: var(--ink); padding: 0 6px; margin-right: 6px; font-weight: 700; }
#prompt small { color: var(--dim); font-weight: 400; margin-left: 6px; }
#hpwrap { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); width: min(320px, 34vw); display: grid; gap: 4px; }
#hpbar { position: relative; height: 22px; background: rgba(0,0,0,.6); border: 1px solid rgba(255,61,110,.6); transform: skewX(-12deg); overflow: hidden; }
#hpFill { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: linear-gradient(180deg, #ff6a8e, #e0184d); transition: width .12s; }
#shFill { position: absolute; left: 0; top: 0; height: 5px; width: 0; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
#hpText { position: absolute; inset: 0; display: grid; place-items: center; transform: skewX(12deg); font-weight: 800; font-size: 14px; text-shadow: 0 1px 0 #000; }
#abilities { position: absolute; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; gap: 8px; }
.ab { position: relative; width: 84px; height: 74px; background: var(--panel); border: 2px solid var(--c); display: grid; place-items: center; text-align: center; overflow: hidden; }
.ab .nm { font-size: 11px; font-weight: 800; line-height: 1.05; letter-spacing: .04em; text-transform: uppercase; padding: 0 4px; position: relative; z-index: 1; text-wrap: balance; }
.ab kbd { position: absolute; left: 4px; top: 2px; font-family: var(--display); font-weight: 700; font-size: 13px; color: var(--c); z-index: 1; }
.ab .lv { position: absolute; right: 4px; top: 2px; font-size: 11px; font-weight: 800; color: var(--dim); z-index: 1; }
.ab .cd { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: rgba(0,0,0,.68); }
.ab .t { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 24px; z-index: 2; text-shadow: 0 2px 0 #000; }
.ab.ready { box-shadow: 0 0 14px -2px var(--c); }
.ab:not(.ready) .nm { opacity: .3; }
#toasts { position: absolute; left: 50%; bottom: 120px; transform: translateX(-50%); display: flex; flex-direction: column-reverse; align-items: center; gap: 6px; }
.toast { background: var(--panel); border: 1px solid var(--c); padding: 6px 16px; font-weight: 600; font-size: 15px; text-align: center; animation: tin .25s ease-out; white-space: nowrap; }
.toast b { color: var(--c); font-family: var(--display); }
.toast i { display: block; font-family: var(--hand); font-style: normal; font-size: 13px; color: var(--dim); margin-top: 1px; }
@keyframes tin { from { transform: translateY(12px); opacity: 0; } }
#dmgLayer div { position: absolute; left: 0; top: 0; font-family: var(--display); font-weight: 700; font-size: 16px; color: #fff; text-shadow: 0 2px 0 #000; white-space: nowrap; will-change: transform; }
#dmgLayer div.crit { color: var(--gold); font-size: 23px; }
#draft { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; background: radial-gradient(ellipse at center, rgba(14,7,24,.6), rgba(14,7,24,.9)); padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); overflow-y: auto; }
#draft h2 { margin: 0; font-family: var(--display); font-style: italic; font-size: clamp(32px, 5.5vw, 60px); color: var(--round); letter-spacing: .06em; text-shadow: 0 4px 0 #000, 0 0 40px rgba(255,59,59,.45); text-align: center; }
#draft h2 small { display: block; font-family: var(--ui); font-style: normal; font-size: 16px; color: var(--dim); letter-spacing: .2em; }
#cards { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
.card { width: 224px; min-height: 250px; background: linear-gradient(180deg, rgba(40,20,66,.96), rgba(20,10,36,.96)); border: 2px solid var(--c); padding: 16px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; transition: transform .12s, box-shadow .12s; animation: cin .3s ease-out backwards; position: relative; }
.card:nth-child(2) { animation-delay: .06s; } .card:nth-child(3) { animation-delay: .12s; }
@keyframes cin { from { transform: translateY(40px) scale(.9); opacity: 0; } }
.card:hover, .card:focus-visible { transform: translateY(-8px); box-shadow: 0 0 0 2px var(--c), 0 0 36px var(--c); outline: none; }
.card .key { position: absolute; top: 10px; right: 12px; font-family: var(--display); font-weight: 700; color: var(--dim); }
.card .rar { font-size: 12px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; color: var(--c); }
.card .kind { font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
.card h3 { margin: 0; font-family: var(--display); font-size: 24px; line-height: 1.05; text-wrap: balance; }
.card p { margin: 0; font-size: 15px; line-height: 1.35; color: #e4d9f7; }
.card .fl { margin: 0; font-family: var(--hand); font-size: 14px; line-height: 1.3; color: var(--dim); transform: rotate(-1.2deg); transform-origin: left; }
.card:nth-child(2) .fl { transform: rotate(.8deg); }
.card .delta { margin-top: auto; font-size: 14px; font-weight: 600; color: var(--c); line-height: 1.4; }
.hint { margin: 0; color: var(--dim); font-size: 14px; letter-spacing: .06em; text-align: center; }
.overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at 50% 40%, rgba(58,20,80,.55), rgba(10,5,18,.92)); padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); overflow-y: auto; }
.panel { max-width: 700px; width: 100%; display: grid; gap: 18px; justify-items: center; text-align: center; padding-block: 24px; }
.logo { font-family: var(--display); font-style: italic; font-weight: 700; font-size: clamp(48px, 11vw, 110px); line-height: .9; letter-spacing: .02em; margin: 0; background: linear-gradient(180deg, #fff 10%, #ffd23f 45%, #ff5a3c 75%, #ff2e9a); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 6px 0 #1a0a26) drop-shadow(0 0 30px rgba(255,90,60,.45)); }
.tag { margin: 0; font-size: 18px; color: var(--dim); max-width: 48ch; line-height: 1.4; }
.btn { pointer-events: auto; font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink); background: var(--gold); border: 0; padding: 14px 36px; cursor: pointer; clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%); transition: transform .1s, background .1s; }
.btn:hover, .btn:focus-visible { background: #fff; transform: scale(1.04); outline: none; }
.btn.alt { background: transparent; color: var(--fg); box-shadow: inset 0 0 0 2px var(--dim); clip-path: none; font-size: 16px; padding: 10px 22px; }
.btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.keys { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 6px 18px; width: 100%; font-size: 15px; text-align: left; }
.keys div { display: flex; gap: 8px; align-items: baseline; }
.keys kbd { font-family: var(--display); font-weight: 700; color: var(--gold); min-width: 74px; }
.statgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; width: 100%; }
.statgrid div { background: var(--panel); border: 1px solid rgba(255,255,255,.1); padding: 10px; }
.statgrid b { display: block; font-family: var(--display); font-size: 26px; color: var(--gold); }
.statgrid span { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
.big { font-family: var(--display); font-style: italic; font-weight: 700; font-size: clamp(40px, 8vw, 76px); margin: 0; line-height: 1; }
.note { font-size: 13px; color: var(--dim); margin: 0; }
.ver { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); font-family: var(--hand); font-size: 14px; color: var(--dim); opacity: .7; transform: rotate(-3deg); }
.logo-wrap { position: relative; }
.logo-wrap .scrawl { position: absolute; right: -6px; bottom: -14px; font-family: var(--hand); font-size: clamp(14px, 2.4vw, 20px); color: var(--cyan); transform: rotate(-7deg); white-space: nowrap; text-shadow: 0 2px 0 #000; }
.cause { font-family: var(--hand); font-size: 20px; color: var(--fg); margin: 0; transform: rotate(-1deg); }
#radio { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(62px + env(safe-area-inset-bottom, 0px)); max-width: min(420px, 60vw); background: var(--panel); border-left: 3px solid var(--cyan); padding: 6px 12px 7px; font-size: 15px; font-weight: 600; line-height: 1.3; opacity: 0; transform: translateY(6px); transition: opacity .2s, transform .2s; }
#radio.on { opacity: 1; transform: none; }
#radio b { font-family: var(--hand); font-weight: 400; color: var(--cyan); margin-right: 8px; letter-spacing: .04em; }
@media (max-width: 760px) { #loadout { display: none; } #radio { bottom: calc(130px + env(safe-area-inset-bottom, 0px)); max-width: 80vw; } #radar { width: 90px; height: 90px; } .card { width: 100%; min-height: 0; } .ab { width: 58px; height: 58px; } .ab .nm { font-size: 9px; } #hpwrap { bottom: calc(92px + env(safe-area-inset-bottom, 0px)); width: 50vw; } }
@media (prefers-reduced-motion: reduce) { .card, .toast, #pointsPop span { animation: none; } }
/* site corner (Back / Commentary) and commentary modal */
.site-corner { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); display: flex; gap: 8px; z-index: 20; }
.site-corner a, .site-corner button { pointer-events: auto; font: 600 14px var(--ui); letter-spacing: .06em; color: var(--fg); background: var(--panel); border: 1px solid rgba(244,236,255,.25); padding: 7px 14px; cursor: pointer; text-decoration: none; }
.site-corner a:hover, .site-corner button:hover, .site-corner a:focus-visible, .site-corner button:focus-visible { border-color: var(--gold); color: var(--gold); outline: none; }
#commentary { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; background: rgba(10,5,18,.85); padding: 24px max(16px, env(safe-area-inset-left, 0px)); }
#commentary .box { background: #170c26; border: 1px solid rgba(244,236,255,.2); max-width: 800px; width: 100%; max-height: 100%; display: flex; flex-direction: column; }
#commentary .body { overflow-y: auto; padding: 24px 28px; font-size: 16px; line-height: 1.6; color: #e4d9f7; user-select: text; -webkit-user-select: text; }
#commentary .body h1, #commentary .body h2, #commentary .body h3 { font-family: var(--display); color: var(--gold); margin: 18px 0 6px; line-height: 1.2; }
#commentary .body > :first-child { margin-top: 0; }
#commentary .body a { color: var(--cyan); }
#commentary .body img { display: block; max-width: 100%; max-height: 70vh; margin: 12px auto; }
#commentary .body figure { margin: 16px 0; }
#commentary .body figcaption { text-align: center; font-size: .9em; font-style: italic; color: var(--dim); }
#commentary .body blockquote { margin: 10px 0; padding: 4px 14px; border-left: 3px solid var(--dim); }
#commentary .body code { background: #ffffff14; padding: 1px 5px; }
#commentary .body pre { background: #00000059; padding: 10px 12px; overflow-x: auto; }
#commentary .foot { padding: 12px 28px 18px; display: flex; justify-content: flex-end; border-top: 1px solid rgba(244,236,255,.12); }
</style>
</head>
<body>

<div id="stage"></div>
<div id="hud" hidden>
  <div id="hurt"></div>
  <div id="zoomv"></div>
  <div id="crosshair"><i></i><i></i><i></i><i></i><b></b></div>
  <div id="hitm"></div>
  <div id="roundbox">
    <div id="roundLbl">ROUND</div><div id="roundNum">1</div>
    <div id="enemiesLeft"></div>
    <div id="points"><span id="ptsVal">500</span><div id="pointsPop"></div></div>
    <div id="powerups"></div>
  </div>
  <div id="bossbar" hidden><div class="bname">VOLTMAW</div><div class="track"><b id="bossFill"></b></div></div>
  <div id="banner"></div>
  <canvas id="radar" width="160" height="160"></canvas>
  <div id="loadout"></div>
  <div id="prompt" hidden></div>
  <div id="hpwrap"><div id="hpbar"><b id="hpFill"></b><b id="shFill"></b><span id="hpText">100 / 100</span></div></div>
  <div id="abilities"></div>
  <div id="toasts"></div>
  <div id="radio"><b>DOT</b><span id="radioText"></span></div>
  <div id="dmgLayer"></div>
</div>
<div id="draft" hidden><h2 id="draftTitle">ROUND CLEARED</h2><div id="cards"></div><p class="hint">Press 1, 2 or 3, or click a card</p></div>
<div id="screen" class="overlay"></div>

<div class="site-corner" id="siteCorner" hidden></div>
<div id="commentary" hidden><div class="box" role="dialog" aria-modal="true" aria-label="Commentary"><div class="body" id="commentaryBody"></div><div class="foot"><button class="btn alt" id="commentaryClose">Close</button></div></div></div>

<script src="vendor/three.min.js"></script>
<script src="vendor/marked.umd.js"></script>
<script>
'use strict';
// =====================================================================
// OVERCHARGE — third-person round-based roguelite shooter
// =====================================================================
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
let seed = 90210;
const srand = () => (seed = (seed * 16807) % 2147483647, (seed - 1) / 2147483646);
const store = {
  get() { try { return JSON.parse(localStorage.getItem('overcharge.meta2')) || {}; } catch (e) { return {}; } },
  set(v) { try { localStorage.setItem('overcharge.meta2', JSON.stringify(v)); } catch (e) {} }
};

// ---------------------------------------------------------------- world
const ARENA = 80;
const BOSS_ROUND = 10;
function groundY(x, z) {
  return 1.1 * Math.sin(x * 0.045 + 1.3) + 0.9 * Math.cos(z * 0.05 - 0.7) + 0.4 * Math.sin((x - z) * 0.09) + 0.2 * Math.sin(x * 0.21) * Math.cos(z * 0.19);
}
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.setSize(innerWidth, innerHeight);
$('stage').appendChild(renderer.domElement);
const scene = new THREE.Scene();
const FOG = new THREE.Color(0x6b2f63);
scene.background = FOG;
scene.fog = new THREE.Fog(FOG, 30, 120);
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 900);
camera.rotation.order = 'YXZ';
scene.add(camera);

const sky = new THREE.Mesh(new THREE.SphereGeometry(600, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: `varying vec3 vP;
  void main(){
    float h = vP.y;
    vec3 hor = vec3(0.42,0.18,0.39), glow = vec3(1.0,0.48,0.38), mid = vec3(0.36,0.12,0.42), top = vec3(0.05,0.03,0.14);
    vec3 c = mix(hor, glow, smoothstep(0.0,0.06,h) * (1.0 - smoothstep(0.06,0.22,h)));
    c = mix(c, mid, smoothstep(0.12,0.35,h));
    c = mix(c, top, smoothstep(0.35,0.95,h));
    if (h < 0.0) c = mix(hor, vec3(0.12,0.05,0.16), smoothstep(0.0,-0.25,h));
    vec3 sd = normalize(vec3(-0.55,0.13,-0.8));
    float s = dot(normalize(vP), sd);

// ---------------------------------------------------------------- spatial grid
const CELL = 4, GOFF = ARENA + 12, GN = Math.ceil(GOFF * 2 / CELL);
const grid = Array.from({ length: GN * GN }, () => []);
const gc = v => clamp(((v + GOFF) / CELL) | 0, 0, GN - 1);
function rebuildGrid() {
  for (let i = 0; i < grid.length; i++) grid[i].length = 0;
  for (const e of enemies) if (e.alive) grid[gc(e.z) * GN + gc(e.x)].push(e);
}
function forNear(x, z, r, cb) {
  const pad = r + (G.boss && G.boss.alive ? 4.5 : 1.6);
  const x0 = gc(x - pad), x1 = gc(x + pad), z0 = gc(z - pad), z1 = gc(z + pad);
  for (let gz = z0; gz <= z1; gz++) for (let gx = x0; gx <= x1; gx++) {
    const c = grid[gz * GN + gx];
    for (let i = 0; i < c.length; i++) { const e = c[i]; if (!e.alive) continue; const dx = e.x - x, dz = e.z - z, rr = r + e.def.r * e.s; if (dx * dx + dz * dz < rr * rr) { if (cb(e) === false) return; } }
  }
}
function nearestEnemy(x, z, maxR, exclude) {
  let best = null, bd = maxR * maxR;
  for (const e of enemies) { if (!e.alive || e.rise > 0 || (exclude && exclude.has(e.id))) continue; const dx = e.x - x, dz = e.z - z, d = dx * dx + dz * dz; if (d < bd) { bd = d; best = e; } }
  return best;
}

// ---------------------------------------------------------------- rounds & spawning
function roundSize(n) { return Math.floor(6 + n * 4 + n * n * 0.6); }
function hpMult() { const n = G.round; return 1 + (n - 1) * 0.32 + Math.max(0, n - 8) ** 2 * 0.06; }
function startRound() {
  G.round++; G.phase = 'fight'; G.toSpawn = roundSize(G.round); G.spawnAcc = 0; G.lowSaid = false;
  // a couple of hand-picked rounds break the pattern
  G.special = G.round === 5 ? 'rush' : G.round === 13 ? 'thirteen' : null;
  if (G.round % BOSS_ROUND === 0) { G.toSpawn = Math.floor(G.toSpawn * 0.5); spawnBoss(); }
  else if (G.special === 'rush') { G.toSpawn = Math.floor(G.toSpawn * 1.3); banner('SKITTER RUSH', "round 5 · it's all legs", 2.6); dot("Oh no. It's the leggy ones. All of them.", 0.8); }
  else if (G.special === 'thirteen') { banner('ROUND 13', 'unlucky. lots of elites.', 2.6); dot("Thirteen. I don't like thirteen.", 0.8); }
  else {
    banner(`ROUND ${G.round}`, G.round === 1 ? 'aim for the visors' : '', 2.2);
    if (DOT.rounds[G.round]) dot(DOT.rounds[G.round], 1); else if (Math.random() < 0.45) dot(pickLine('generic'), 1.5);

}

function spawnEnemy(type, x, z, elite) {
  const def = ETYPES[type], s = elite ? 1.45 : 1, hp = def.hp * hpMult() * (elite ? 4 : 1);
  const e = { id: eid++, type, def, x, z, y: groundY(x, z) - 1.8, rise: 1, vy: 0, kx: 0, kz: 0, hp, maxHp: hp, flash: 0, elite: !!elite, s, alive: true, cd: rand(1.5, 3), wob: Math.random() * TAU, face: 0, stun: 0 };

}
function spawnPoint(minD, maxD) {
  for (let i = 0; i < 16; i++) {

    const r = Math.hypot(x, z);
    if (r > ARENA - 2) { x *= (ARENA - 2) / r; z *= (ARENA - 2) / r; }
    if (Math.hypot(x - G.pos.x, z - G.pos.z) > minD * 0.7 && !rocks.some(o => Math.hypot(o.x - x, o.z - z) < o.r + 1)) return [x, z];

function pickType() {

function updateRounds(dt) {

    if (G.draftAt) return;
    G.breakT -= dt;

  const n = G.round, maxAlive = Math.min(18 + n * 4, 110);

    G.spawnAcc -= 1; G.toSpawn--;

    spawnEnemy(pickType(), x, z, n >= 4 && Math.random() < (G.special === 'thirteen' ? 0.35 : Math.min(0.15, 0.02 + n * 0.008)));

// ---------------------------------------------------------------- combat
function hurtEnemy(e, base, opt) {

  const crit = Math.random() < S.crit;
  let dmg = base * S.dmg * (crit ? S.critMult : 1) * (opt.head ? (opt.headX || S.headMult) : 1) * (G.zoomK > 0.5 && opt.gun ? 1 + S.zoomDmg : 1);

  if (opt.stun) e.stun = Math.max(e.stun, e.type === 'boss' ? opt.stun * 0.15 : opt.stun);
  dmgNumber(e.x, e.y + e.def.h * e.s + 0.3, e.z, dmg, crit || opt.head);
  addPoints(10);
  if (S.leech > 0 && G.leechCD <= 0) { G.hp = Math.min(S.maxHp, G.hp + S.leech); G.leechCD = 0.05; }
  if (!opt.proc) {
    if (S.staticP > 0 && Math.random() < S.staticP) chainLightning(e, 3, base * 0.8, 9);
    if (crit && S.warhead > 0) explode(e.x, e.y + 1, e.z, 3.2, base * 0.6 * S.warhead, 0xffa63d, true);

}

  SFX.kill();

    G.hitstop = 0.4; G.shake = 1.2; SFX.slam(); banner('VOLTMAW FALLS', 'the shift goes on. so do they.', 3); dotOnce('bossDown', 2);
    const m = store.get(); m.wins = (m.wins || 0) + 1; store.set(m);

  n = 0;
  const cp = camera.position;
  for (const p of parts) { if (n >= 1400) break; const cd = (p.x - cp.x) ** 2 + (p.y - cp.y) ** 2 + (p.z - cp.z) ** 2; const s = p.s * Math.max(0.05, p.life / p.max) * (cd < 9 ? Math.sqrt(cd) / 3 : 1); PV.set(p.x, p.y, p.z); SV.set(s, s, s); M4.compose(PV, Q, SV); partMesh.setMatrixAt(n, M4); partMesh.setColorAt(n, p.c); n++; }
  partMesh.count = n; partMesh.instanceMatrix.needsUpdate = true; if (partMesh.instanceColor) partMesh.instanceColor.needsUpdate = true;
  let li = 0;
  const push = (p, c, k) => { if (li >= LINE_CAP) return; linePos[li * 3] = p[0]; linePos[li * 3 + 1] = p[1]; linePos[li * 3 + 2] = p[2]; lineCol[li * 3] = c.r * k; lineCol[li * 3 + 1] = c.g * k; lineCol[li * 3 + 2] = c.b * k; li++; };
  for (const L of lines) {
    const k = L.life / L.max, segs = L.jit > 0 ? 5 : 1;
    let prev = L.a;
    for (let s = 1; s <= segs; s++) {
      const t = s / segs, j = s < segs ? L.jit : 0;
      const cur = [lerp(L.a[0], L.b[0], t) + rand(-j, j), lerp(L.a[1], L.b[1], t) + rand(-j, j), lerp(L.a[2], L.b[2], t) + rand(-j, j)];
      push(prev, L.c, k); push(cur, L.c, k); prev = cur;
    }
  }
  lineGeo.setDrawRange(0, li); lineGeo.attributes.position.needsUpdate = true; lineGeo.attributes.color.needsUpdate = true;
}
function syncHero(dt) {
  hero.position.copy(G.pos);
  hero.rotation.y = G.bodyYaw;
  const hs = Math.hypot(G.vel.x, G.vel.z);
  const sw = G.onGround ? Math.sin(G.walk) * Math.min(1, hs / 6) * 0.8 : 0.4;
  heroParts.legL.rotation.x = sw; heroParts.legR.rotation.x = -sw;
  for (const arm of [heroParts.armL, heroParts.armR]) {
    arm.userData.kick = Math.max(0, arm.userData.kick - dt * 10);
    arm.rotation.x = G.pitch + arm.userData.kick * 0.12;
    arm.position.z = arm.userData.kick * 0.06;
    arm.userData.fl.material.opacity = Math.max(0, arm.userData.fl.material.opacity - dt * 16);
  }
  if (G.roll > 0) {
    const k = 1 - G.roll / 0.38;
    // roll around the axis perpendicular to the roll direction, in hero-local space
    const local = Math.atan2(G.rollDir.x, G.rollDir.z) - G.bodyYaw;
    heroBody.rotation.set(0, 0, 0); heroBody.position.y = 0.6;
    heroBody.rotateOnAxis(TMP.set(Math.cos(local), 0, -Math.sin(local)), k * TAU);
  } else { heroBody.rotation.set(0, 0, 0); heroBody.position.y = lerp(heroBody.position.y, 0.95, 0.3); }
  hero.visible = !(G.iframes > 0 && G.roll <= 0 && Math.sin(G.t * 40) > 0.3);
  heroParts.tip.visible = Math.sin(G.t * 5) > -0.2;
  shieldBubble.visible = G.shield > 0;
  if (shieldBubble.visible) { shieldBubble.position.set(G.pos.x, G.pos.y + 1, G.pos.z); shieldBubble.rotation.y += dt; }
}

const radar = $('radar'), rctx = radar.getContext('2d');
function drawRadar() {
  const W = radar.width, R = W / 2, range = 45, sc = R / range;
  rctx.clearRect(0, 0, W, W);
  rctx.save(); rctx.beginPath(); rctx.arc(R, R, R - 1, 0, TAU); rctx.clip();
  rctx.strokeStyle = 'rgba(244,236,255,.12)'; rctx.beginPath(); rctx.arc(R, R, R * 0.5, 0, TAU); rctx.stroke();
  const fx = -Math.sin(G.yaw), fz = -Math.cos(G.yaw), rx = Math.cos(G.yaw), rz = -Math.sin(G.yaw);
  const plot = (x, z) => { const dx = x - G.pos.x, dz = z - G.pos.z; return [R + (dx * rx + dz * rz) * sc, R - (dx * fx + dz * fz) * sc]; };
  const edge = (x, y) => { const dd = Math.hypot(x - R, y - R); return dd > R - 6 ? [R + (x - R) / dd * (R - 6), R + (y - R) / dd * (R - 6)] : [x, y]; };
  for (const st of stations) {
    const [x, y] = edge(...plot(st.x, st.z));
    rctx.fillStyle = st.kind === 'perk' ? '#' + new THREE.Color(st.perk.color).getHexString() : st.kind === 'crate' ? '#c86bff' : '#ff9a3d';
    rctx.beginPath(); rctx.moveTo(x, y - 5); rctx.lineTo(x + 5, y); rctx.lineTo(x, y + 5); rctx.lineTo(x - 5, y); rctx.fill();
  }
  for (const d of drops) { const [x, y] = edge(...plot(d.x, d.z)); rctx.fillStyle = POWERUPS[d.k].color; rctx.beginPath(); rctx.arc(x, y, 4, 0, TAU); rctx.fill(); }
  for (const e of enemies) {
    if (!e.alive) continue; const [x, y] = plot(e.x, e.z);
    if (x < 0 || y < 0 || x > W || y > W) continue;
    rctx.fillStyle = e.type === 'boss' ? '#c86bff' : e.elite ? '#ffffff' : '#ff4a5a';
    const s = e.type === 'boss' ? 9 : e.elite ? 4 : 3; rctx.fillRect(x - s / 2, y - s / 2, s, s);
  }
  rctx.restore();
  rctx.fillStyle = '#4ff3ff'; rctx.beginPath(); rctx.moveTo(R, R - 7); rctx.lineTo(R + 5, R + 5); rctx.lineTo(R - 5, R + 5); rctx.fill();
}
let hudT = 0;
function updateHud(dt) {
  $('hurt').style.opacity = Math.max(G.hurtFlash, G.hp / S.maxHp < 0.3 ? 0.35 + 0.15 * Math.sin(G.t * 6) : 0);
  $('zoomv').style.opacity = G.zoomK;
  const spreadPx = 6 + (G.overdrive > 0 ? 0 : (0.012 + G.bloom) * (1 - G.zoomK * 0.85) * 700);
  $('crosshair').style.setProperty('--g', `${spreadPx.toFixed(1)}px`);
  G.hitmT -= dt; $('hitm').style.opacity = G.hitmT > 0 ? 1 : 0;
  for (const s in SLOTS) {
    const sl = G.slots[s], ab = abEls[s]; if (!ab) continue;
    ab.cd.style.height = `${sl.cd / cdOf(s) * 100}%`;
    ab.t.textContent = sl.cd > 0 ? (sl.cd < 1 ? sl.cd.toFixed(1) : Math.ceil(sl.cd)) : '';
    const ready = sl.cd <= 0; if (ready !== ab.ready) { ab.ready = ready; ab.el.classList.toggle('ready', ready); }
  }
  hudT -= dt; if (hudT > 0) return; hudT = 0.1;
  $('roundNum').textContent = Math.max(1, G.round);
  $('roundLbl').textContent = G.phase === 'break' ? (G.round === 0 ? 'STARTING IN ' + Math.ceil(G.breakT) : `NEXT ROUND IN ${Math.ceil(G.breakT)}`) : 'ROUND';
  $('enemiesLeft').textContent = G.phase === 'fight' ? `${G.toSpawn + enemies.length} left` : 'Go shopping';
  $('ptsVal').textContent = G.points.toLocaleString();
  $('powerups').innerHTML = Object.entries(G.powers).map(([k, t]) => `<span class="pu" style="--c:${POWERUPS[k].color}">${POWERUPS[k].name} ${Math.ceil(t)}</span>`).join('') + (G.overdrive > 0 ? `<span class="pu" style="--c:#ff7ad9">Overdrive ${Math.ceil(G.overdrive)}</span>` : '');
  $('hpFill').style.width = `${Math.max(0, G.hp / S.maxHp * 100)}%`;
  $('shFill').style.width = `${Math.min(100, G.shield / S.maxHp * 100)}%`;
  $('hpText').textContent = `${Math.max(0, Math.ceil(G.hp))} / ${S.maxHp}${G.shield > 0 ? ` +${Math.ceil(G.shield)}` : ''}`;
  drawRadar();
}

// ---------------------------------------------------------------- camera & loop
const PIVOT = new THREE.Vector3(), CDIR = new THREE.Vector3(), CRIGHT = new THREE.Vector3();
function updateCamera(dt) {
  const z = G.zoomK;
  const dist = lerp(4.3, 2.3, z), side = lerp(0.95, 0.7, z), up = lerp(0.35, 0.2, z);
  const cp = Math.cos(G.pitch);
  CDIR.set(-Math.sin(G.yaw) * cp, Math.sin(G.pitch), -Math.cos(G.yaw) * cp);
  CRIGHT.set(Math.cos(G.yaw), 0, -Math.sin(G.yaw));
  PIVOT.set(G.pos.x, G.pos.y + 1.6, G.pos.z).addScaledVector(CRIGHT, side);
  // pull the camera in if a pillar or the ground is in the way
  let d = dist;
  for (let t = 0.4; t <= dist; t += 0.25) { if (solidAt(PIVOT.x - CDIR.x * t, PIVOT.y - CDIR.y * t + up - 0.25, PIVOT.z - CDIR.z * t)) { d = Math.max(0.6, t - 0.3); break; } }
  const shake = G.shake * 0.3;
  camera.position.set(PIVOT.x - CDIR.x * d + rand(-shake, shake), PIVOT.y - CDIR.y * d + up + rand(-shake, shake), PIVOT.z - CDIR.z * d);
  camera.rotation.set(G.pitch, G.yaw, 0);
  G.shake = Math.max(0, G.shake - dt * 2.2);
  const fovT = lerp(72, 46, z) + (G.roll > 0 ? 6 : 0);
  if (Math.abs(camera.fov - fovT) > 0.05) { camera.fov = lerp(camera.fov, fovT, Math.min(1, 12 * dt)); camera.updateProjectionMatrix(); }
  camera.updateMatrixWorld();
  sky.position.copy(camera.position);
  G.hurtFlash = Math.max(0, G.hurtFlash - dt * 3);
  for (const p of pads) p.ring.position.y = p.y + 0.4 + ((G.t * 1.5) % 1) * 1.2, p.ring.material.opacity = 1 - ((G.t * 1.5) % 1);
}
const _proj = new THREE.Vector3();
function updateDmgNumbers() {
  const W = innerWidth, H = innerHeight;
  for (const d of dmgPool) {
    if (d.life <= 0) continue;
    _proj.set(d.x, d.y, d.z).project(camera);
    if (_proj.z > 1) { d.el.style.display = 'none'; continue; }
    d.el.style.display = 'block';
    d.el.style.transform = `translate(${(_proj.x + 1) / 2 * W}px, ${(1 - _proj.y) / 2 * H}px) translate(-50%,-50%) scale(${0.7 + d.life * 0.6})`;
    d.el.style.opacity = Math.min(1, d.life * 3);
  }
}
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  let dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!G || state === 'title') { titleCam(now); renderer.render(scene, camera); return; }
  if (state === 'play') {
    if (G.hitstop > 0) { G.hitstop -= dt; dt = 0; }
    if (dt > 0) {
      G.t += dt;
      rebuildGrid();
      updatePlayer(dt);
      updateCamera(dt);
      syncHero(dt);
      hero.updateMatrixWorld(true);
      updateCombat(dt);
      updateEnemies(dt);
      updateProjectiles(dt);
      updateDrops(dt);
      updateStations();
      updateRounds(dt);
      updateParticles(dt);
    }
    updateHud(dt || 0.016);
  }
  syncInstances();
  updateDmgNumbers();
  renderer.render(scene, camera);
}
function titleCam(now) {
  const t = now / 1000 * 0.05;
  camera.position.set(Math.cos(t) * 40, 14, Math.sin(t) * 40);
  camera.lookAt(0, 2, 0); camera.fov = 70; camera.updateProjectionMatrix();
  sky.position.copy(camera.position);
}
hero.position.set(0, groundY(0, 4), 4);
showTitle();
requestAnimationFrame(frame);
</script>
